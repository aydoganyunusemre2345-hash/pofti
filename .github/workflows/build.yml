name: APK Derle
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir -p www && cp pofti.html www/index.html
      - run: npm install --legacy-peer-deps
      - run: npx cap add android
      - run: sed -i 's#gradle-[0-9.]*-\(all\|bin\).zip#gradle-8.7-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
      - run: |
          A=android/app/src/main/assets
          mkdir -p $A/model-tr
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip
          unzip -q vosk-model-small-tr-0.3.zip
          cp -r vosk-model-small-tr-0.3/* $A/model-tr/
          cat /proc/sys/kernel/random/uuid > $A/model-tr/uuid
          printf '\ndependencies {\n    implementation "net.java.dev.jna:jna:5.13.0@aar"\n    implementation "com.alphacephei:vosk-android:0.3.47"\n}\n' >> android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
      - run: |
          R=android/app/src/main/res
          for d in $R/mipmap-*dpi; do
            cp pofti_fg.png $d/ic_launcher_foreground.png
            cp pofti_icon.png $d/ic_launcher.png
            cp pofti_icon.png $d/ic_launcher_round.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0B1230</color></resources>' > $R/values/ic_launcher_background.xml
      - run: python3 make_widget.py
      - run: |
          D=android/app/src/main/java/com/pofti/app
          mkdir -p $D android/app/src/main/res/xml android/app/src/main/res/values
          cp PoftiPlugin.java PoftiService.java PoftiWake.java PoftiAssist.java PoftiVosk.java PoftiNotif.java PoftiWidget.java OverlayActivity.java MainActivity.java $D/
          cp pofti_accessibility.xml pofti_voice.xml pofti_recog.xml android/app/src/main/res/xml/
          cp pofti_strings.xml android/app/src/main/res/values/
      - run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.FOREGROUND_SERVICE" /><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" /><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" /><uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" /><uses-permission android:name="android.permission.READ_CONTACTS" /><uses-permission android:name="com.android.alarm.permission.SET_ALARM" /><queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent></queries><application#' $M
          sed -i 's#</application>#<receiver android:name=".PoftiWidget" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/pofti_widget_info" /></receiver><activity android:name=".OverlayActivity" android:theme="@style/PoftiOverlay" android:exported="true" android:launchMode="singleTask" android:excludeFromRecents="true" android:taskAffinity="" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode" /><service android:name=".PoftiWake" android:exported="false" android:foregroundServiceType="microphone" /><service android:name=".PoftiNotif" android:exported="true" android:label="Pofti" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"><intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter></service><service android:name=".PoftiService" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/pofti_accessibility" /></service><service android:name=".PoftiAssist" android:label="Pofti" android:exported="true" android:permission="android.permission.BIND_VOICE_INTERACTION"><meta-data android:name="android.voice_interaction" android:resource="@xml/pofti_voice" /><intent-filter><action android:name="android.service.voice.VoiceInteractionService" /></intent-filter></service><service android:name=".PoftiAssist$SessSvc" android:exported="true" android:permission="android.permission.BIND_VOICE_INTERACTION" /><service android:name=".PoftiAssist$Recog" android:label="Pofti" android:exported="true"><intent-filter><action android:name="android.speech.RecognitionService" /><category android:name="android.intent.category.DEFAULT" /></intent-filter><meta-data android:name="android.speech" android:resource="@xml/pofti_recog" /></service></application>#' $M
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pofti.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > pofti.p12
            AP=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
            $AP sign --ks pofti.p12 --ks-pass env:KS_PASS --out pofti-signed.apk pofti.apk
            mv pofti-signed.apk pofti.apk
          fi
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: Pofti-APK
          path: pofti.apk
