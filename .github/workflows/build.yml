name: APK Derle
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir -p www && cp pofti.html www/index.html
      - run: npm install --legacy-peer-deps
      - run: npx cap add android
      - run: sed -i 's#gradle-[0-9.]*-\(all\|bin\).zip#gradle-8.7-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
      - run: |
          D=android/app/src/main/java/com/pofti/app
          mkdir -p $D android/app/src/main/res/xml android/app/src/main/res/values
          cp PoftiPlugin.java PoftiService.java PoftiWake.java PoftiAssist.java MainActivity.java $D/
          cp pofti_accessibility.xml pofti_voice.xml pofti_recog.xml android/app/src/main/res/xml/
          cp pofti_strings.xml android/app/src/main/res/values/
      - run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.FOREGROUND_SERVICE" /><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" /><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" /><uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" /><queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent></queries><application#' $M
          sed -i 's#</application>#<service android:name=".PoftiWake" android:exported="false" android:foregroundServiceType="microphone" /><service android:name=".PoftiService" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/pofti_accessibility" /></service><service android:name=".PoftiAssist" android:label="Pofti" android:exported="true" android:permission="android.permission.BIND_VOICE_INTERACTION"><meta-data android:name="android.voice_interaction" android:resource="@xml/pofti_voice" /><intent-filter><action android:name="android.service.voice.VoiceInteractionService" /></intent-filter></service><service android:name=".PoftiAssist$SessSvc" android:exported="true" android:permission="android.permission.BIND_VOICE_INTERACTION" /><service android:name=".PoftiAssist$Recog" android:label="Pofti" android:exported="true"><intent-filter><action android:name="android.speech.RecognitionService" /><category android:name="android.intent.category.DEFAULT" /></intent-filter><meta-data android:name="android.speech" android:resource="@xml/pofti_recog" /></service></application>#' $M
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pofti-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
